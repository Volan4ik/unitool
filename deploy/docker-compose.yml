version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
  bot:
    build: ..
    env_file: ../.env.example
    depends_on: [db]
volumes:
  pgdata: {}