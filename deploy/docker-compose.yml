services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Override DB connection for compose network
      - DATABASE_URL=postgres://bot:bot@db:5432/bot?sslmode=disable
    ports: ["8080:8080"]
    depends_on: [db]
volumes:
  pgdata: {}
