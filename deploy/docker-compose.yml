version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      # Override DB connection for compose network
      - DATABASE_URL=postgres://bot:bot@db:5432/bot?sslmode=disable
    depends_on: [db]
volumes:
  pgdata: {}
