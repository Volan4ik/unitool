version: "2"

sql:
  - engine: postgresql
    queries: "internal/db/queries/*.sql"
    schema:
      - "migrations/schema.sql"
      - "migrations/0003_chat_messages.sql"
    gen:
      go:
        package: generated
        out: "internal/db/generated"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        sql_package: "pgx/v5"
